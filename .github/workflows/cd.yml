name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build API jars
        working-directory: backend
        run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/${owner}"
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            tag="sha-${GITHUB_SHA::7}"
          fi

          docker build \
            -t "${registry}/shiye-user-api:${tag}" \
            -t "${registry}/shiye-user-api:latest" \
            -f backend/shiye-user-api/Dockerfile backend/shiye-user-api

          docker build \
            -t "${registry}/shiye-admin-api:${tag}" \
            -t "${registry}/shiye-admin-api:latest" \
            -f backend/shiye-admin-api/Dockerfile backend/shiye-admin-api

          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -t "${registry}/shiye-user-web:${tag}" \
            -t "${registry}/shiye-user-web:latest" \
            frontend/user-web

          docker build \
            --build-arg VITE_ADMIN_API_BASE_URL=/admin/api/v1 \
            -t "${registry}/shiye-admin-web:${tag}" \
            -t "${registry}/shiye-admin-web:latest" \
            frontend/admin-web

          docker push "${registry}/shiye-user-api:${tag}"
          docker push "${registry}/shiye-user-api:latest"
          docker push "${registry}/shiye-admin-api:${tag}"
          docker push "${registry}/shiye-admin-api:latest"
          docker push "${registry}/shiye-user-web:${tag}"
          docker push "${registry}/shiye-user-web:latest"
          docker push "${registry}/shiye-admin-web:${tag}"
          docker push "${registry}/shiye-admin-web:latest"

  deploy:
    needs: images
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            export IMAGE_PREFIX="${{ vars.IMAGE_PREFIX }}"
            export IMAGE_TAG=latest
            docker compose pull
            docker compose up -d
            docker image prune -f
