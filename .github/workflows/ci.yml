name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven tests
        working-directory: backend
        run: mvn -B test
      - name: Check Node test scripts
        run: |
          node --check scripts/load-test.mjs
          node --check scripts/load-test-chat.mjs
          node --check scripts/mock-ai.mjs

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [user-web, admin-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: frontend/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: npm run build

  extension-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        working-directory: frontend/user-extension
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest ok')"

  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/user-web/package-lock.json
      - name: Install dependencies
        working-directory: frontend/user-web
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/user-web
        run: npx playwright install --with-deps chromium
      - name: Run auth E2E
        working-directory: frontend/user-web
        run: npx playwright test e2e/auth.spec.ts

  monitoring-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/monitoring/alerts.yml:/tmp/alerts.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 check rules /tmp/alerts.yml
      - name: Validate Alertmanager config
        run: |
          sed 's|__WEBHOOK_URL__|http://localhost:19090/shiye-alerts|' \
            deploy/monitoring/alertmanager.yml.tmpl > /tmp/alertmanager.yml
          docker run --rm \
            -v "/tmp/alertmanager.yml:/tmp/alertmanager.yml:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /tmp/alertmanager.yml
      - name: Validate load-test compose overlay
        run: |
          docker compose -f deploy/docker-compose.yml \
            -f deploy/docker-compose.loadtest.yml config --quiet

  hnsw-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shiye
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MySQL and Redis clients
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client redis-tools
      - name: Initialize schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye < deploy/sql/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye < deploy/sql/seed.sql
      - name: Create old index without team scope
        run: |
          redis-cli -h 127.0.0.1 -p 6379 FT.CREATE idx:kb_chunks ON HASH PREFIX 1 kb:chunk: \
            SCHEMA user_id TAG article_id TAG chunk_id NUMERIC embedding_model TAG \
            vector_bin VECTOR HNSW 6 TYPE FLOAT32 DIM 768 DISTANCE_METRIC COSINE
      - name: Build API
        working-directory: backend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mvn -B -DskipTests clean package; then
              exit 0
            fi
            echo "Maven package failed (attempt ${attempt}); retrying..."
            sleep 10
          done
          exit 1
      - name: Start user API with RediSearch
        run: |
          nohup java -jar backend/shiye-user-api/target/shiye-user-api-0.1.0-SNAPSHOT.jar \
            --spring.datasource.url='jdbc:mysql://127.0.0.1:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true' \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            --shiye.jwt.user-secret=ci-user-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            --shiye.ai.embedding.provider=dev \
            --shiye.ai.vector.store=redisearch \
            --shiye.ai.vector.backfill=true \
            --shiye.bookmark.worker-enabled=false \
            > /tmp/shiye-hnsw-api.log 2>&1 &
          echo $! > /tmp/shiye-hnsw-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/tmp/shiye-hnsw-health.json; then
              cat /tmp/shiye-hnsw-health.json
              exit 0
            fi
            sleep 2
          done
          echo 'HNSW user API did not become healthy'
          exit 1
      - name: HNSW smoke test
        run: bash scripts/ci-hnsw-smoke.sh
      - name: Show API log on failure
        if: failure()
        run: tail -n 300 /tmp/shiye-hnsw-api.log || true
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/shiye-hnsw-api.pid)" || true

  business-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shiye
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Initialize schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye < deploy/sql/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye < deploy/sql/seed.sql
      - name: Build API
        working-directory: backend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mvn -B -DskipTests clean package; then
              exit 0
            fi
            echo "Maven package failed (attempt ${attempt}); retrying..."
            sleep 10
          done
          exit 1
      - name: Start mock AI
        run: |
          nohup node scripts/mock-ai.mjs 19091 > /tmp/mock-ai.log 2>&1 &
          echo $! > /tmp/mock-ai.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19091/health; then
              exit 0
            fi
            sleep 1
          done
          echo 'mock AI did not become healthy'
          exit 1
      - name: Start user API
        run: |
          nohup java -jar backend/shiye-user-api/target/shiye-user-api-0.1.0-SNAPSHOT.jar \
            --spring.datasource.url='jdbc:mysql://127.0.0.1:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true' \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            --shiye.jwt.user-secret=ci-user-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            --shiye.ai.enabled=true \
            --shiye.ai.chat.base-url=http://127.0.0.1:19091/v1 \
            --shiye.ai.chat.api-key=mock \
            --shiye.ai.chat.model=mock-chat \
            --shiye.ai.embedding.provider=http \
            --shiye.ai.embedding.base-url=http://127.0.0.1:19091/v1 \
            --shiye.ai.embedding.api-key=mock \
            --shiye.ai.embedding.model=mock-embedding \
            --shiye.ai.embedding.dimension=1024 \
            --shiye.ai.rerank.enabled=false \
            --shiye.ai.enrichment.enabled=false \
            --shiye.bookmark.worker-enabled=false \
            --shiye.eval.worker-enabled=false \
            > /tmp/shiye-business-api.log 2>&1 &
          echo $! > /tmp/shiye-business-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/tmp/shiye-business-health.json; then
              cat /tmp/shiye-business-health.json
              exit 0
            fi
            sleep 2
          done
          echo 'user API did not become healthy'
          exit 1
      - name: Start admin API
        run: |
          nohup java -jar backend/shiye-admin-api/target/shiye-admin-api-0.1.0-SNAPSHOT.jar \
            --spring.datasource.url='jdbc:mysql://127.0.0.1:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true' \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            --shiye.jwt.admin-secret=ci-admin-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            --shiye.ai.enabled=true \
            --shiye.ai.chat.base-url=http://127.0.0.1:19091/v1 \
            --shiye.ai.chat.api-key=mock \
            --shiye.ai.chat.model=mock-chat \
            > /tmp/shiye-business-admin.log 2>&1 &
          echo $! > /tmp/shiye-business-admin.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/actuator/health >/tmp/shiye-business-admin-health.json; then
              cat /tmp/shiye-business-admin-health.json
              exit 0
            fi
            sleep 2
          done
          echo 'admin API did not become healthy'
          exit 1
      - name: Install user-web dependencies
        working-directory: frontend/user-web
        run: npm ci
      - name: Install admin-web dependencies
        working-directory: frontend/admin-web
        run: npm ci
      - name: Install Chromium
        working-directory: frontend/user-web
        run: npx playwright install --with-deps chromium
      - name: Start web dev servers
        run: |
          (cd frontend/user-web && \
            VITE_API_BASE_URL=http://127.0.0.1:18080/api/v1 \
            nohup npm run dev -- --host 127.0.0.1 --port 15173 > /tmp/user-web.log 2>&1 & \
            echo $! > /tmp/user-web.pid)
          (cd frontend/admin-web && \
            VITE_ADMIN_API_BASE_URL=http://127.0.0.1:18081/admin/api/v1 \
            nohup npm run dev -- --host 127.0.0.1 --port 15174 > /tmp/admin-web.log 2>&1 & \
            echo $! > /tmp/admin-web.pid)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:15173 > /dev/null \
              && curl -fsS http://127.0.0.1:15174 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'web dev servers did not become healthy'
          exit 1
      - name: User business E2E
        working-directory: frontend/user-web
        env:
          E2E_BASE_URL: http://127.0.0.1:15173
        run: npx playwright test e2e/business.spec.ts
      - name: Admin E2E
        working-directory: frontend/admin-web
        env:
          E2E_BASE_URL: http://127.0.0.1:15174
        run: npx playwright test e2e/admin.spec.ts
      - name: Show logs on failure
        if: failure()
        run: |
          tail -n 200 /tmp/shiye-business-api.log || true
          tail -n 200 /tmp/shiye-business-admin.log || true
          tail -n 100 /tmp/mock-ai.log || true
      - name: Stop services
        if: always()
        run: |
          kill "$(cat /tmp/shiye-business-api.pid)" || true
          kill "$(cat /tmp/shiye-business-admin.pid)" || true
          kill "$(cat /tmp/mock-ai.pid)" || true
          kill "$(cat /tmp/user-web.pid)" || true
          kill "$(cat /tmp/admin-web.pid)" || true

  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shiye
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Initialize schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye < deploy/sql/schema.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye < deploy/sql/seed.sql
      - name: Build API
        working-directory: backend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mvn -B -DskipTests clean package; then
              exit 0
            fi
            echo "Maven package failed (attempt ${attempt}); retrying..."
            sleep 10
          done
          exit 1
      - name: Start user API
        run: |
          nohup java -jar backend/shiye-user-api/target/shiye-user-api-0.1.0-SNAPSHOT.jar \
            --spring.datasource.url='jdbc:mysql://127.0.0.1:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true' \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.data.redis.host=127.0.0.1 \
            --spring.data.redis.port=6379 \
            --shiye.jwt.user-secret=ci-user-secret-0123456789-abcdefghijklmnopqrstuvwxyz \
            --shiye.ai.embedding.provider=dev \
            --shiye.bookmark.worker-enabled=false \
            > /tmp/shiye-user-api.log 2>&1 &
          echo $! > /tmp/shiye-user-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/tmp/shiye-health.json; then
              cat /tmp/shiye-health.json
              exit 0
            fi
            sleep 2
          done
          echo 'user API did not become healthy'
          exit 1
      - name: Smoke test
        run: bash scripts/ci-smoke.sh
      - name: Team smoke test
        run: bash scripts/ci-team-smoke.sh
      - name: Backup/restore drill
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 3306 -uroot -proot shiye -e \
            "CREATE TABLE IF NOT EXISTS restore_drill_marker (id INT PRIMARY KEY, note VARCHAR(64)); INSERT INTO restore_drill_marker VALUES (1,'before-restore') ON DUPLICATE KEY UPDATE note='before-restore';"
          mysqldump -h 127.0.0.1 -P 3306 -uroot -proot --single-transaction --routines --triggers --no-tablespaces --default-character-set=utf8mb4 shiye > /tmp/shiye-restore.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "DROP DATABASE IF EXISTS shiye_restore_drill; CREATE DATABASE shiye_restore_drill;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot --default-character-set=utf8mb4 shiye_restore_drill < /tmp/shiye-restore.sql
          test "$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT note FROM shiye_restore_drill.restore_drill_marker WHERE id=1")" = "before-restore"
          tables=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='shiye_restore_drill' AND table_type='BASE TABLE'")
          test "$tables" -ge 30
          echo "restore drill passed: tables=$tables"
      - name: Show API log on failure
        if: failure()
        run: tail -n 200 /tmp/shiye-user-api.log || true
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/shiye-user-api.pid)" || true
