server:
  port: 18081

spring:
  application:
    name: shiye-admin-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 统一会话时区为 UTC，和 Java 侧 LocalDateTime.now(UTC) 对齐
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

shiye:
  jwt:
    # 必须与 USER_JWT_SECRET 不同；生产通过环境变量覆盖，至少 32 字节
    admin-secret: ${ADMIN_JWT_SECRET:dev-admin-secret-change-me-32-bytes-minimum}
    admin-expire-seconds: ${ADMIN_JWT_EXPIRE_SECONDS:900}
    refresh-expire-seconds: ${REFRESH_EXPIRE_SECONDS:2592000}
  auth:
    rate-limit-per-minute: ${ADMIN_RATE_LIMIT_PER_MINUTE:60}
  chat:
    rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:10}
  ai:
    citation-required: ${AI_CITATION_REQUIRED:true}
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:1600}
      temperature: ${DEEPSEEK_TEMPERATURE:0.25}
      input-price: ${DEEPSEEK_INPUT_PRICE:2.0}
      output-price: ${DEEPSEEK_OUTPUT_PRICE:8.0}
      timeout-ms: ${DEEPSEEK_TIMEOUT_MS:45000}
    embedding:
      provider: ${EMBEDDING_PROVIDER:dev}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      dimension: ${EMBEDDING_DIMENSION:1024}
      batch-size: ${EMBEDDING_BATCH_SIZE:16}
      timeout-ms: ${EMBEDDING_TIMEOUT_MS:30000}
    retrieval:
      top-k: ${RETRIEVAL_TOP_K:8}
      hybrid-enabled: ${RETRIEVAL_HYBRID_ENABLED:true}
      rerank-enabled: ${RETRIEVAL_RERANK_ENABLED:true}
  article:
    chunk-target-size: ${CHUNK_TARGET_SIZE:700}
    chunk-overlap: ${CHUNK_OVERLAP:100}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
    invitation-required: ${REGISTRATION_INVITATION_REQUIRED:false}
    invitation-code: ${REGISTRATION_INVITATION_CODE:}
    default-token-quota: ${REGISTRATION_DEFAULT_TOKEN_QUOTA:200000}
    default-cost-quota: ${REGISTRATION_DEFAULT_COST_QUOTA:5.000000}
  alert:
    webhook-enabled: ${ALERT_WEBHOOK_ENABLED:false}
    webhook-url: ${ALERT_WEBHOOK_URL:}
  audit:
    retention-enabled: ${AUDIT_RETENTION_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:180}
    retention-cron: "${AUDIT_RETENTION_CRON:0 30 3 * * *}"
  usage:
    global-monthly-tokens: ${GLOBAL_MONTHLY_TOKENS:2000000}
    global-monthly-cost: ${GLOBAL_MONTHLY_COST:20.00}
    alert-threshold: ${USAGE_ALERT_THRESHOLD:0.8}
    daily-token-limit: ${USAGE_DAILY_TOKEN_LIMIT:0}
