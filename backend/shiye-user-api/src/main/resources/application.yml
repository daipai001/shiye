server:
  port: 18080

spring:
  application:
    name: shiye-user-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 统一会话时区为 UTC，和 Java 侧 LocalDateTime.now(UTC) 对齐
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

shiye:
  jwt:
    # 生产必须通过环境变量覆盖，至少 32 字节
    user-secret: ${USER_JWT_SECRET:dev-user-secret-change-me-32-bytes-minimum}
    user-expire-seconds: ${USER_JWT_EXPIRE_SECONDS:900}
    refresh-expire-seconds: ${REFRESH_EXPIRE_SECONDS:2592000}
  ai:
    enabled: ${AI_ENABLED:false}
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-ms: ${DEEPSEEK_TIMEOUT_MS:45000}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:1600}
      temperature: ${DEEPSEEK_TEMPERATURE:0.25}
      input-price: ${DEEPSEEK_INPUT_PRICE:2.0}
      output-price: ${DEEPSEEK_OUTPUT_PRICE:8.0}
    enrichment:
      # 资料 READY 后异步生成 AI 摘要和 2-5 个标签；失败保留原摘要
      enabled: ${AI_ENRICHMENT_ENABLED:true}
      max-input-chars: ${AI_ENRICHMENT_MAX_INPUT_CHARS:6000}
      max-tags: ${AI_ENRICHMENT_MAX_TAGS:5}
      max-tokens: ${AI_ENRICHMENT_MAX_TOKENS:500}
    embedding:
      # dev = 本地确定性向量（仅用于联调，不是语义向量）；http = OpenAI 兼容 /embeddings
      provider: ${EMBEDDING_PROVIDER:dev}
      model: ${EMBEDDING_MODEL:DEV-HASH-1024}
      dimension: ${EMBEDDING_DIMENSION:1024}
      batch-size: ${EMBEDDING_BATCH_SIZE:16}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${EMBEDDING_API_KEY:}
      timeout-ms: ${EMBEDDING_TIMEOUT_MS:30000}
    rerank:
      # BGE-reranker，OpenAI 兼容 /rerank；未配置 key 时自动跳过并回退混合检索
      enabled: ${RERANK_ENABLED:false}
      base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${RERANK_API_KEY:}
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      top-n: ${RERANK_TOP_N:20}
      timeout-ms: ${RERANK_TIMEOUT_MS:20000}
    retrieval:
      top-k: ${RETRIEVAL_TOP_K:8}
      max-per-article: ${RETRIEVAL_MAX_PER_ARTICLE:3}
      min-score: ${RETRIEVAL_MIN_SCORE:0.2}
      max-scan-chunks: ${RETRIEVAL_MAX_SCAN_CHUNKS:5000}
      vector-candidates: ${RETRIEVAL_VECTOR_CANDIDATES:30}
      keyword-candidates: ${RETRIEVAL_KEYWORD_CANDIDATES:20}
      rrf-k: ${RETRIEVAL_RRF_K:60}
      hybrid-enabled: ${RETRIEVAL_HYBRID_ENABLED:true}
      rerank-enabled: ${RETRIEVAL_RERANK_ENABLED:true}
      rerank-candidates: ${RETRIEVAL_RERANK_CANDIDATES:20}
  usage:
    global-monthly-tokens: ${GLOBAL_MONTHLY_TOKENS:2000000}
    global-monthly-cost: ${GLOBAL_MONTHLY_COST:20.00}
  bookmark:
    worker-enabled: ${BOOKMARK_WORKER_ENABLED:true}
    worker-delay-ms: ${BOOKMARK_WORKER_DELAY_MS:3000}
    worker-max-items-per-tick: ${BOOKMARK_WORKER_MAX_ITEMS:2}
    fetch-timeout-seconds: ${BOOKMARK_FETCH_TIMEOUT_SECONDS:20}
    max-page-bytes: ${BOOKMARK_MAX_PAGE_BYTES:5242880}
  article:
    max-text-chars: ${ARTICLE_MAX_TEXT_CHARS:500000}
    chunk-target-size: ${CHUNK_TARGET_SIZE:700}
    chunk-max-size: ${CHUNK_MAX_SIZE:900}
    chunk-min-size: ${CHUNK_MIN_SIZE:200}
    chunk-overlap: ${CHUNK_OVERLAP:100}
    max-chunks: ${ARTICLE_MAX_CHUNKS:500}
