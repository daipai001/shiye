server:
  port: 18080

spring:
  application:
    name: shiye-user-api
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 统一会话时区为 UTC，和 Java 侧 LocalDateTime.now(UTC) 对齐
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}

shiye:
  jwt:
    # 生产必须通过环境变量覆盖，至少 32 字节
    user-secret: ${USER_JWT_SECRET:dev-user-secret-change-me-32-bytes-minimum}
    user-expire-seconds: ${USER_JWT_EXPIRE_SECONDS:900}
    refresh-expire-seconds: ${REFRESH_EXPIRE_SECONDS:2592000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:15173,http://127.0.0.1:15173,chrome-extension://*}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@shiye.local}
    public-url: ${APP_PUBLIC_URL:http://localhost:15173}
  email-token:
    verify-expire-minutes: ${EMAIL_VERIFY_EXPIRE_MINUTES:1440}
    reset-expire-minutes: ${PASSWORD_RESET_EXPIRE_MINUTES:30}
  auth:
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  chat:
    rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:10}
    executor:
      # 每个流式回答占用一个线程；并发高时按需调大
      core-size: ${CHAT_EXECUTOR_CORE_SIZE:16}
      max-size: ${CHAT_EXECUTOR_MAX_SIZE:32}
      queue-capacity: ${CHAT_EXECUTOR_QUEUE_CAPACITY:100}
  ai:
    enabled: ${AI_ENABLED:false}
    citation-required: ${AI_CITATION_REQUIRED:true}
    vector:
      # hash = Redis Hash + 应用层余弦；redisearch = Redis Stack HNSW
      store: ${VECTOR_STORE:hash}
      # 首次切换 redisearch 时设为 true，把旧 base64 向量回填成 vector_bin
      backfill: ${VECTOR_BACKFILL:false}
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-ms: ${DEEPSEEK_TIMEOUT_MS:45000}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:1600}
      temperature: ${DEEPSEEK_TEMPERATURE:0.25}
      input-price: ${DEEPSEEK_INPUT_PRICE:2.0}
      output-price: ${DEEPSEEK_OUTPUT_PRICE:8.0}
    enrichment:
      # 资料 READY 后异步生成 AI 摘要和 2-5 个标签；失败保留原摘要
      enabled: ${AI_ENRICHMENT_ENABLED:true}
      max-input-chars: ${AI_ENRICHMENT_MAX_INPUT_CHARS:6000}
      max-tags: ${AI_ENRICHMENT_MAX_TAGS:5}
      max-tokens: ${AI_ENRICHMENT_MAX_TOKENS:500}
    embedding:
      # dev = 本地确定性向量（仅用于联调，不是语义向量）；http = OpenAI 兼容 /embeddings
      provider: ${EMBEDDING_PROVIDER:dev}
      model: ${EMBEDDING_MODEL:DEV-HASH-1024}
      dimension: ${EMBEDDING_DIMENSION:1024}
      batch-size: ${EMBEDDING_BATCH_SIZE:16}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${EMBEDDING_API_KEY:}
      timeout-ms: ${EMBEDDING_TIMEOUT_MS:30000}
    rerank:
      # BGE-reranker，OpenAI 兼容 /rerank；未配置 key 时自动跳过并回退混合检索
      enabled: ${RERANK_ENABLED:false}
      base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${RERANK_API_KEY:}
      model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
      top-n: ${RERANK_TOP_N:20}
      timeout-ms: ${RERANK_TIMEOUT_MS:20000}
    retrieval:
      top-k: ${RETRIEVAL_TOP_K:8}
      max-per-article: ${RETRIEVAL_MAX_PER_ARTICLE:3}
      min-score: ${RETRIEVAL_MIN_SCORE:0.2}
      max-scan-chunks: ${RETRIEVAL_MAX_SCAN_CHUNKS:5000}
      vector-candidates: ${RETRIEVAL_VECTOR_CANDIDATES:30}
      keyword-candidates: ${RETRIEVAL_KEYWORD_CANDIDATES:20}
      rrf-k: ${RETRIEVAL_RRF_K:60}
      hybrid-enabled: ${RETRIEVAL_HYBRID_ENABLED:true}
      rerank-enabled: ${RETRIEVAL_RERANK_ENABLED:true}
      rerank-candidates: ${RETRIEVAL_RERANK_CANDIDATES:20}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
    invitation-required: ${REGISTRATION_INVITATION_REQUIRED:false}
    invitation-code: ${REGISTRATION_INVITATION_CODE:}
    default-token-quota: ${REGISTRATION_DEFAULT_TOKEN_QUOTA:200000}
    default-cost-quota: ${REGISTRATION_DEFAULT_COST_QUOTA:5.000000}
  alert:
    webhook-enabled: ${ALERT_WEBHOOK_ENABLED:false}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    budget-scheduler-enabled: ${BUDGET_ALERT_SCHEDULER_ENABLED:true}
    budget-initial-delay-ms: ${BUDGET_ALERT_INITIAL_DELAY_MS:30000}
    budget-delay-ms: ${BUDGET_ALERT_DELAY_MS:60000}
  usage:
    global-monthly-tokens: ${GLOBAL_MONTHLY_TOKENS:2000000}
    global-monthly-cost: ${GLOBAL_MONTHLY_COST:20.00}
    alert-threshold: ${USAGE_ALERT_THRESHOLD:0.8}
    # 每次流式问答开始前预留的个人配额，结束后释放
    chat-reserve-tokens: ${CHAT_RESERVE_TOKENS:8000}
    chat-reserve-cost: ${CHAT_RESERVE_COST:0.06}
    daily-token-limit: ${USAGE_DAILY_TOKEN_LIMIT:0}
    daily-aggregation-enabled: ${USAGE_DAILY_AGGREGATION_ENABLED:true}
    daily-cron: "${USAGE_DAILY_CRON:0 15 0 * * *}"
    daily-backfill-days: ${USAGE_DAILY_BACKFILL_DAYS:7}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./data/uploads}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: "${RETENTION_CRON:0 30 3 * * *}"
    refresh-token-days: ${RETENTION_REFRESH_TOKEN_DAYS:30}
    extension-code-days: ${RETENTION_EXTENSION_CODE_DAYS:7}
    idempotency-days: ${RETENTION_IDEMPOTENCY_DAYS:1}
    ingest-task-days: ${RETENTION_INGEST_TASK_DAYS:30}
    batch-limit: ${RETENTION_BATCH_LIMIT:1000}
  eval:
    worker-enabled: ${EVAL_WORKER_ENABLED:true}
    worker-delay-ms: ${EVAL_WORKER_DELAY_MS:30000}
    # RUNNING 超过该分钟数视为 worker 中断，自动标记为 FAILED
    stale-minutes: ${EVAL_STALE_MINUTES:30}
  bookmark:
    worker-enabled: ${BOOKMARK_WORKER_ENABLED:true}
    worker-delay-ms: ${BOOKMARK_WORKER_DELAY_MS:3000}
    worker-max-items-per-tick: ${BOOKMARK_WORKER_MAX_ITEMS:2}
    fetch-timeout-seconds: ${BOOKMARK_FETCH_TIMEOUT_SECONDS:20}
    max-page-bytes: ${BOOKMARK_MAX_PAGE_BYTES:5242880}
  article:
    # 同一资料同时只处理一个入库/重建索引任务
    ingest-lock-minutes: ${INGEST_LOCK_MINUTES:30}
    max-text-chars: ${ARTICLE_MAX_TEXT_CHARS:500000}
    max-upload-bytes: ${ARTICLE_MAX_UPLOAD_BYTES:20971520}
    chunk-target-size: ${CHUNK_TARGET_SIZE:700}
    chunk-max-size: ${CHUNK_MAX_SIZE:900}
    chunk-min-size: ${CHUNK_MIN_SIZE:200}
    chunk-overlap: ${CHUNK_OVERLAP:100}
    max-chunks: ${ARTICLE_MAX_CHUNKS:500}
    ocr-enabled: ${OCR_ENABLED:false}
    ocr-command: ${OCR_COMMAND:tesseract}
    ocr-lang: ${OCR_LANG:chi_sim+eng}
    ocr-min-text-chars: ${OCR_MIN_TEXT_CHARS:80}
    ocr-max-pages: ${OCR_MAX_PAGES:20}
    ocr-dpi: ${OCR_DPI:200}
    ocr-timeout-ms: ${OCR_TIMEOUT_MS:60000}
