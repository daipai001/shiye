# 本地 AI/RAG 压测叠加配置：使用 mock 模型，不访问外部 API。
# 用法见 scripts/README.md；不要用于生产。
services:
  mock-ai:
    image: node:22-alpine
    container_name: shiye-mock-ai
    command: ["node", "/app/mock-ai.mjs", "19091"]
    volumes:
      - ../scripts/mock-ai.mjs:/app/mock-ai.mjs:ro
    ports:
      - "${MOCK_AI_PORT:-19091}:19091"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:19091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-api:
    environment:
      AI_ENABLED: "true"
      AI_ENRICHMENT_ENABLED: "false"
      DEEPSEEK_BASE_URL: http://mock-ai:19091/v1
      DEEPSEEK_API_KEY: mock-load-test
      DEEPSEEK_MODEL: mock-chat
      DEEPSEEK_INPUT_PRICE: "0"
      DEEPSEEK_OUTPUT_PRICE: "0"
      DEEPSEEK_TIMEOUT_MS: "30000"
      RETRIEVAL_RERANK_ENABLED: "false"
      RERANK_ENABLED: "false"
      CHAT_RATE_LIMIT_PER_MINUTE: "100000"
      REGISTRATION_DEFAULT_TOKEN_QUOTA: "100000000"
    depends_on:
      mock-ai:
        condition: service_healthy
