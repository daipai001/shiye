name: shiye

services:
  mysql:
    image: mysql:8.4
    container_name: shiye-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: shiye
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis/redis-stack-server:latest
    container_name: shiye-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  user-api:
    image: ${IMAGE_PREFIX:-shiye}/shiye-user-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend/shiye-user-api
    container_name: shiye-user-api
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_JWT_SECRET: ${USER_JWT_SECRET:-dev-user-secret-change-me-32-bytes-minimum}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:15173,http://127.0.0.1:15173,chrome-extension://*}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      REGISTRATION_INVITATION_REQUIRED: ${REGISTRATION_INVITATION_REQUIRED:-false}
      REGISTRATION_INVITATION_CODE: ${REGISTRATION_INVITATION_CODE:-}
      REGISTRATION_DEFAULT_TOKEN_QUOTA: ${REGISTRATION_DEFAULT_TOKEN_QUOTA:-200000}
      REGISTRATION_DEFAULT_COST_QUOTA: ${REGISTRATION_DEFAULT_COST_QUOTA:-5.000000}
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      BUDGET_ALERT_SCHEDULER_ENABLED: ${BUDGET_ALERT_SCHEDULER_ENABLED:-true}
      BUDGET_ALERT_INITIAL_DELAY_MS: ${BUDGET_ALERT_INITIAL_DELAY_MS:-30000}
      BUDGET_ALERT_DELAY_MS: ${BUDGET_ALERT_DELAY_MS:-60000}
      GLOBAL_MONTHLY_TOKENS: ${GLOBAL_MONTHLY_TOKENS:-2000000}
      GLOBAL_MONTHLY_COST: ${GLOBAL_MONTHLY_COST:-20.00}
      USAGE_ALERT_THRESHOLD: ${USAGE_ALERT_THRESHOLD:-0.8}
      USAGE_DAILY_TOKEN_LIMIT: ${USAGE_DAILY_TOKEN_LIMIT:-0}
      USAGE_DAILY_AGGREGATION_ENABLED: ${USAGE_DAILY_AGGREGATION_ENABLED:-true}
      USAGE_DAILY_CRON: "${USAGE_DAILY_CRON:-0 15 0 * * *}"
      USAGE_DAILY_BACKFILL_DAYS: ${USAGE_DAILY_BACKFILL_DAYS:-7}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RETRIEVAL_HYBRID_ENABLED: ${RETRIEVAL_HYBRID_ENABLED:-true}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      AI_CITATION_REQUIRED: ${AI_CITATION_REQUIRED:-true}
      CHUNK_TARGET_SIZE: ${CHUNK_TARGET_SIZE:-700}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_COMMAND: ${OCR_COMMAND:-tesseract}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-80}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-20}
      OCR_DPI: ${OCR_DPI:-200}
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-60000}
      EVAL_WORKER_ENABLED: ${EVAL_WORKER_ENABLED:-true}
      EVAL_WORKER_DELAY_MS: ${EVAL_WORKER_DELAY_MS:-30000}
      FILE_UPLOAD_DIR: /app/data/uploads
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_CRON: "${RETENTION_CRON:-0 30 3 * * *}"
      RETENTION_REFRESH_TOKEN_DAYS: ${RETENTION_REFRESH_TOKEN_DAYS:-30}
      RETENTION_EXTENSION_CODE_DAYS: ${RETENTION_EXTENSION_CODE_DAYS:-7}
      RETENTION_IDEMPOTENCY_DAYS: ${RETENTION_IDEMPOTENCY_DAYS:-1}
      RETENTION_INGEST_TASK_DAYS: ${RETENTION_INGEST_TASK_DAYS:-30}
      RETENTION_BATCH_LIMIT: ${RETENTION_BATCH_LIMIT:-1000}
      AI_ENABLED: ${AI_ENABLED:-false}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_ENRICHMENT_ENABLED: ${AI_ENRICHMENT_ENABLED:-true}
      AI_ENRICHMENT_MAX_INPUT_CHARS: ${AI_ENRICHMENT_MAX_INPUT_CHARS:-6000}
      AI_ENRICHMENT_MAX_TAGS: ${AI_ENRICHMENT_MAX_TAGS:-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dev}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: 1024
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-https://api.siliconflow.cn/v1}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_TOP_N: ${RERANK_TOP_N:-20}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-20000}
      RETRIEVAL_RERANK_CANDIDATES: ${RETRIEVAL_RERANK_CANDIDATES:-20}
    ports:
      - "${USER_API_PORT:-18080}:18080"
    volumes:
      - shiye-uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-api:
    image: ${IMAGE_PREFIX:-shiye}/shiye-admin-api:${IMAGE_TAG:-latest}
    build:
      context: ../backend/shiye-admin-api
    container_name: shiye-admin-api
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/shiye?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-secret-change-me-32-bytes-minimum}
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-60}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      REGISTRATION_INVITATION_REQUIRED: ${REGISTRATION_INVITATION_REQUIRED:-false}
      REGISTRATION_INVITATION_CODE: ${REGISTRATION_INVITATION_CODE:-}
      REGISTRATION_DEFAULT_TOKEN_QUOTA: ${REGISTRATION_DEFAULT_TOKEN_QUOTA:-200000}
      REGISTRATION_DEFAULT_COST_QUOTA: ${REGISTRATION_DEFAULT_COST_QUOTA:-5.000000}
      ALERT_WEBHOOK_ENABLED: ${ALERT_WEBHOOK_ENABLED:-false}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      GLOBAL_MONTHLY_TOKENS: ${GLOBAL_MONTHLY_TOKENS:-2000000}
      GLOBAL_MONTHLY_COST: ${GLOBAL_MONTHLY_COST:-20.00}
      USAGE_ALERT_THRESHOLD: ${USAGE_ALERT_THRESHOLD:-0.8}
      USAGE_DAILY_TOKEN_LIMIT: ${USAGE_DAILY_TOKEN_LIMIT:-0}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      RETRIEVAL_HYBRID_ENABLED: ${RETRIEVAL_HYBRID_ENABLED:-true}
      RETRIEVAL_RERANK_ENABLED: ${RETRIEVAL_RERANK_ENABLED:-true}
      AI_CITATION_REQUIRED: ${AI_CITATION_REQUIRED:-true}
      CHUNK_TARGET_SIZE: ${CHUNK_TARGET_SIZE:-700}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dev}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: 1024
    ports:
      - "${ADMIN_API_PORT:-18081}:18081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-web:
    image: ${IMAGE_PREFIX:-shiye}/shiye-user-web:${IMAGE_TAG:-latest}
    build:
      context: ../frontend/user-web
    container_name: shiye-user-web
    ports:
      - "${USER_WEB_PORT:-15173}:80"
    depends_on:
      - user-api

  admin-web:
    image: ${IMAGE_PREFIX:-shiye}/shiye-admin-web:${IMAGE_TAG:-latest}
    build:
      context: ../frontend/admin-web
    container_name: shiye-admin-web
    ports:
      - "${ADMIN_WEB_PORT:-15174}:80"
    depends_on:
      - admin-api

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: shiye-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - user-api
      - admin-api

volumes:
  mysql-data:
  redis-data:
  shiye-uploads:
  prometheus-data:
