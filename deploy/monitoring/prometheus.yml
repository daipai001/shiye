global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shiye-user-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-api:18080"]

  - job_name: shiye-admin-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["admin-api:18081"]
