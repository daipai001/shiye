<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾页 ShiYe · 可点击原型</title>
<style>
  :root {
    --primary: #2f6fed;
    --primary-600: #1f5bd7;
    --primary-soft: #eaf1ff;
    --bg: #f4f6fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #6b7280;
    --faint: #9ca3af;
    --line: #e3e8f0;
    --soft: #f8fafc;
    --success: #0f9d76;
    --success-soft: #e7f7f1;
    --warning: #b45309;
    --warning-soft: #fff4e5;
    --danger: #dc2626;
    --danger-soft: #fdeaea;
    --purple: #7c3aed;
    --purple-soft: #f3e8ff;
    --shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
    --shadow-lg: 0 18px 48px rgba(23, 32, 51, 0.16);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.55;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  a { color: var(--primary); text-decoration: none; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .small { font-size: 11px; }
  .tiny { font-size: 10px; }
  .bold { font-weight: 700; }
  .row { display: flex; align-items: center; }
  .gap-6 { gap: 6px; }
  .gap-8 { gap: 8px; }
  .gap-10 { gap: 10px; }
  .gap-12 { gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .nowrap { white-space: nowrap; }
  .hidden { display: none !important; }

  /* demo bar */
  .demo-bar {
    height: 50px;
    background: #0f172a;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .demo-brand { font-weight: 700; color: #fff; font-size: 14px; white-space: nowrap; }
  .demo-brand span { font-weight: 400; color: #94a3b8; font-size: 11px; margin-left: 6px; }
  .demo-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .demo-tabs button {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    padding: 6px 11px;
    border-radius: 999px;
    font-size: 11.5px;
  }
  .demo-tabs button:hover { background: #1e293b; color: #fff; }
  .demo-tabs button.active { background: #2f6fed; color: #fff; font-weight: 600; }
  .demo-note { margin-left: auto; color: #94a3b8; font-size: 10.5px; white-space: nowrap; }
  .demo-note button {
    margin-left: 8px;
    border: 1px solid #334155;
    background: transparent;
    color: #cbd5e1;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 10.5px;
  }
  .demo-note button:hover { background: #1e293b; }

  /* generic */
  .btn {
    border: 0;
    background: var(--primary);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: background .15s;
  }
  .btn:hover { background: var(--primary-600); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: #374151; border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--soft); }
  .btn-soft { background: var(--primary-soft); color: var(--primary); }
  .btn-soft:hover { background: #dce8ff; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: 5px 9px; font-size: 11px; border-radius: 6px; }
  .btn-xs { padding: 3px 7px; font-size: 10px; border-radius: 5px; font-weight: 600; }
  .btn-block { width: 100%; }
  .input, .select, .textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    padding: 8px 10px;
    font-size: 12px;
    outline: none;
  }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,111,237,.1); }
  .input::placeholder, .textarea::placeholder { color: var(--faint); }
  .textarea { resize: vertical; min-height: 72px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .field-row { display: flex; gap: 8px; }
  .field-row > * { flex: 1; min-width: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card-head {
    padding: 14px 16px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .card-head h3 { margin: 0; font-size: 13.5px; }
  .card-head p { margin: 2px 0 0; color: var(--muted); font-size: 10.5px; }
  .card-body { padding: 14px 16px 16px; }
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 999px;
    background: #f1f4f9;
    color: #5b6472;
    font-size: 10px;
    white-space: nowrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 10px;
    white-space: nowrap;
  }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.run { background: var(--warning-soft); color: var(--warning); }
  .badge.fail { background: var(--danger-soft); color: var(--danger); }
  .badge.neutral { background: #f1f4f9; color: var(--muted); }
  .badge.purple { background: var(--purple-soft); color: var(--purple); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: #4b5563;
    font-size: 10.5px;
    white-space: nowrap;
  }
  .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pill.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
  .progress {
    height: 7px;
    background: #e7ecf5;
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .25s; }
  .progress.success > i { background: var(--success); }
  .progress.warning > i { background: var(--warning); }
  .progress.danger > i { background: var(--danger); }
  .table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .table th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    font-size: 10px;
    background: var(--soft);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .table td { padding: 9px 10px; border-bottom: 1px solid #eef1f6; vertical-align: middle; }
  .table tr:last-child td { border-bottom: 0; }
  .table tr:hover td { background: #fbfcfe; }
  .empty {
    text-align: center;
    padding: 46px 20px;
    color: var(--muted);
  }
  .empty .big { font-size: 28px; margin-bottom: 8px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px; flex: none;
  }
  .avatar.dark { background: #1e293b; color: #fff; }
  .avatar.green { background: var(--success-soft); color: var(--success); }
  .avatar.purple { background: var(--purple-soft); color: var(--purple); }

  /* toast + modal */
  #toast-wrap {
    position: fixed;
    top: 64px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: #111827;
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 11.5px;
    box-shadow: var(--shadow-lg);
    animation: toastIn .2s ease-out;
    max-width: 520px;
    text-align: center;
  }
  .toast.success { background: #0f766e; }
  .toast.error { background: #b91c1c; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  #modal-root { position: fixed; inset: 0; z-index: 250; display: none; }
  #modal-root.show { display: block; }
  .modal-mask { position: absolute; inset: 0; background: rgba(15,23,42,.42); }
  .modal-card {
    position: relative;
    width: 420px;
    max-width: calc(100vw - 40px);
    margin: 12vh auto 0;
    background: #fff;
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { margin: 0; font-size: 14px; }
  .modal-head button { border: 0; background: transparent; color: var(--faint); font-size: 18px; line-height: 1; }
  .modal-body { padding: 16px; }
  .modal-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: var(--soft); }

  /* login */
  .login-shell { min-height: calc(100vh - 50px); display: grid; grid-template-columns: 1.05fr .95fr; }
  .login-brand {
    background: linear-gradient(145deg, #101b35 0%, #162a56 55%, #0f3460 100%);
    color: #fff;
    padding: 54px 58px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .login-brand::after {
    content: "";
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(47,111,237,.38), transparent 68%);
    right: -120px; bottom: -120px;
  }
  .login-logo { font-size: 30px; font-weight: 800; letter-spacing: 1px; }
  .login-logo span { font-size: 12px; font-weight: 400; color: #93c5fd; margin-left: 8px; letter-spacing: 0; }
  .login-slogan { margin-top: 22px; font-size: 26px; line-height: 1.45; font-weight: 700; max-width: 460px; }
  .login-slogan em { color: #93c5fd; font-style: normal; }
  .login-desc { margin-top: 12px; color: #cbd5e1; font-size: 12.5px; max-width: 420px; }
  .login-points { display: grid; gap: 12px; margin-top: 30px; }
  .login-point { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; color: #dbeafe; }
  .login-point i {
    width: 22px; height: 22px; border-radius: 7px;
    background: rgba(147,197,253,.14);
    border: 1px solid rgba(147,197,253,.3);
    display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 11px; color: #bfdbfe; flex: none;
  }
  .login-foot { color: #94a3b8; font-size: 10.5px; }
  .login-form-wrap { display: flex; align-items: center; justify-content: center; padding: 36px; }
  .login-card { width: 380px; max-width: 100%; }
  .login-card h2 { margin: 0 0 4px; font-size: 22px; }
  .login-card .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .login-tabs { display: flex; gap: 4px; background: #eef2f8; border-radius: 9px; padding: 3px; margin-bottom: 18px; }
  .login-tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 0; border-radius: 7px; font-size: 12px; }
  .login-tabs button.active { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(23,32,51,.08); }
  .login-note { background: var(--primary-soft); color: #1e40af; border-radius: 8px; padding: 8px 10px; font-size: 10.5px; margin-top: 12px; }
  .login-demo { margin-top: 14px; font-size: 10.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .login-demo button { border: 0; background: transparent; color: var(--primary); font-size: 10.5px; padding: 0; }

  /* web shell */
  .web-shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 50px); }
  .sidebar {
    background: #fff;
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 50px;
    height: calc(100vh - 50px);
  }
  .side-brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 16px; }
  .side-brand .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
    box-shadow: 0 6px 14px rgba(47,111,237,.28);
  }
  .side-brand b { font-size: 14px; }
  .side-brand small { display: block; color: var(--faint); font-size: 9.5px; font-weight: 400; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 8px;
    color: #4b5563; font-size: 12.5px;
    border: 0; background: transparent; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--soft); color: var(--ink); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .nav-item .ico { width: 18px; text-align: center; font-size: 12px; opacity: .85; }
  .side-spacer { flex: 1; }
  .side-box { background: var(--soft); border: 1px solid var(--line); border-radius: 9px; padding: 10px; font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
  .side-box b { color: var(--ink); display: block; margin-bottom: 2px; }
  .side-user { display: flex; align-items: center; gap: 8px; padding: 8px 6px 2px; border-top: 1px solid var(--line); margin-top: 6px; }
  .side-user .name { font-size: 11.5px; font-weight: 600; }
  .side-user .role { font-size: 9.5px; color: var(--faint); }
  .web-main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 0 24px;
    position: sticky; top: 50px; z-index: 20;
  }
  .topbar h1 { margin: 0; font-size: 15px; }
  .topbar .crumb { color: var(--faint); font-size: 10.5px; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .quota-chip { background: var(--soft); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: 10.5px; color: var(--muted); }
  .quota-chip b { color: var(--ink); }
  .web-content { padding: 22px 24px 40px; width: 100%; max-width: 1240px; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .page-head h2 { margin: 0; font-size: 21px; }
  .page-head p { margin: 3px 0 0; color: var(--muted); font-size: 11.5px; }
  .head-actions { display: flex; gap: 7px; flex-wrap: wrap; }

  /* library */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .stat-card b { display: block; font-size: 20px; line-height: 1.35; }
  .stat-card span { color: var(--muted); font-size: 10.5px; }
  .stat-card .trend { color: var(--success); font-size: 10px; margin-left: 4px; }
  .add-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .add-bar .input { flex: 1; min-width: 260px; height: 36px; }
  .filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .article-list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .article-row { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #eef1f6; align-items: flex-start; }
  .article-row:last-child { border-bottom: 0; }
  .article-row:hover { background: #fbfcfe; }
  .file-ico {
    width: 34px; height: 34px; border-radius: 9px;
    background: #eef2f8; display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex: none;
  }
  .article-main { flex: 1; min-width: 0; }
  .article-title { font-weight: 700; font-size: 12.5px; margin-bottom: 2px; cursor: pointer; }
  .article-title:hover { color: var(--primary); }
  .article-desc { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .article-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; color: var(--faint); font-size: 10px; }
  .article-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .article-side .muted { font-size: 10px; }
  .filter-note { color: var(--faint); font-size: 10px; margin: -2px 0 10px; }

  /* detail */
  .breadcrumb { color: var(--faint); font-size: 10.5px; margin-bottom: 8px; }
  .detail-title { font-size: 22px; line-height: 1.35; margin: 0 0 5px; }
  .detail-meta { color: var(--muted); font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .detail-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
  .summary-card { background: #f5f8ff; border: 1px solid #d7e3ff; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .summary-card h4 { margin: 0 0 6px; font-size: 11.5px; color: var(--primary); }
  .summary-card ul { margin: 0; padding-left: 18px; color: #374151; font-size: 11.5px; }
  .summary-card li { margin: 3px 0; }
  .tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--line); margin-bottom: 14px; font-size: 11.5px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 0 0 8px; }
  .tabs button.active { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--primary); }
  .detail-grid { display: grid; grid-template-columns: 1fr 280px; gap: 14px; align-items: start; }
  .article-body { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; font-size: 12px; color: #3f4a5a; }
  .article-body p { margin: 0 0 11px; }
  .article-body h4 { margin: 18px 0 8px; font-size: 13px; color: var(--ink); }
  .chunk-box {
    border: 1px dashed #b9c7e8;
    background: #f8faff;
    border-radius: 9px;
    padding: 12px 13px;
    margin: 13px 0;
    position: relative;
    transition: background .2s, border-color .2s;
  }
  .chunk-box.highlight { background: #fff7e6; border-color: #f0b45a; box-shadow: 0 0 0 3px rgba(240,180,90,.16); }
  .chunk-label { position: absolute; top: -8px; left: 11px; background: var(--primary-soft); color: var(--primary); font-size: 9px; padding: 1px 7px; border-radius: 999px; border: 1px solid #d7e3ff; }
  .chunk-list-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .chunk-item { padding: 9px 11px; border-bottom: 1px solid #eef1f6; font-size: 10.5px; color: var(--muted); cursor: pointer; }
  .chunk-item:last-child { border-bottom: 0; }
  .chunk-item:hover, .chunk-item.active { background: var(--primary-soft); }
  .chunk-item b { color: var(--ink); font-size: 10.5px; }
  .chunk-item .score { float: right; color: var(--success); font-weight: 700; }
  .chunk-item span { color: var(--faint); }
  .status-banner { border-radius: 9px; padding: 10px 12px; font-size: 11px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .status-banner.run { background: var(--warning-soft); color: var(--warning); }
  .status-banner.fail { background: var(--danger-soft); color: var(--danger); }
  .meta-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .meta-table td { padding: 8px 0; border-bottom: 1px dashed #eef1f6; }
  .meta-table td:first-child { color: var(--muted); width: 140px; }

  /* chat */
  .chat-layout { display: grid; grid-template-columns: 205px 1fr 255px; min-height: calc(100vh - 190px); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .conv-list { border-right: 1px solid var(--line); background: var(--soft); padding: 10px 9px; overflow: auto; }
  .conv-item { padding: 8px 9px; border-radius: 7px; font-size: 11px; color: #4b5563; margin-bottom: 2px; cursor: pointer; }
  .conv-item:hover { background: #eef2f8; }
  .conv-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .conv-item small { display: block; color: var(--faint); font-size: 9.5px; font-weight: 400; margin-top: 2px; }
  .chat-main { display: flex; flex-direction: column; min-width: 0; }
  .chat-head { padding: 11px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .chat-head b { font-size: 13px; margin-right: 3px; }
  .chat-body { flex: 1; padding: 16px; overflow: auto; max-height: calc(100vh - 340px); }

  /* ============================================================
     v0.4 — more air, more hierarchy
     ============================================================ */
  body { font-size: 14px; line-height: 1.65; }
  .small { font-size: 12px; }

  .muted { color: #64748b; }

  /* layout */
  .web-shell { grid-template-columns: 244px 1fr; }
  .sidebar { padding: 22px 16px; gap: 6px; }
  .side-brand { padding: 4px 10px 20px; }

  .side-brand b { font-size: 16px; }

    width: 30px; height: 30px; border-radius: 9px; flex: none;

    font-size: 13px;

  .admin-sidebar .nav-item:hover .ico { background: rgba(255, 255, 255, .1); }
  .admin-sidebar .nav-item.active .ico { background: var(--primary); color: #fff; }
  .side-brand .logo { background: linear-gradient(135deg, #3b82f6, #7c3aed); }
  .side-box { padding: 12px; font-size: 11.5px; border-radius: 12px; }

  .topbar .crumb { font-size: 11.5px; }
  .quota-chip { padding: 7px 12px; font-size: 11.5px; }
  .web-content { padding: 30px 32px 56px; max-width: 1320px; }
  .page-head { margin-bottom: 24px; }
  .page-head h2 { font-size: 26px; letter-spacing: -.03em; }
  .page-head p { font-size: 13px; margin-top: 4px; }
  .head-actions { gap: 9px; }

  /* controls */
  .btn { padding: 10px 16px; border-radius: 10px; font-size: 13px; }
  .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 8px; }
  .btn-xs { padding: 4px 9px; font-size: 11px; border-radius: 6px; }

  .tag { padding: 3px 9px; font-size: 11px; }

  .field { margin-bottom: 14px; }
  .field label { font-size: 11.5px; margin-bottom: 5px; }

  /* cards */
  .card, .article-list, .chat-layout, .settings-card, .admin-table-card, .budget-card, .stat-card, .admin-stat, .model-card, .plugin-card, .rail-card {
    border-radius: 18px;

  .card-head p { font-size: 12px; }

  .admin-stat { padding: 18px 20px; min-height: 104px; }

  /* hero */
  .hero {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 28px;
    padding: 32px 36px; border-radius: 24px; color: #fff;
    background:
      radial-gradient(700px 400px at 15% 0%, rgba(59, 130, 246, .35), transparent 60%),
      radial-gradient(600px 400px at 100% 100%, rgba(124, 58, 237, .28), transparent 60%),
      linear-gradient(135deg, #0b1220, #101d38 55%, #0f2a5c);
    box-shadow: 0 22px 50px rgba(16, 27, 53, .2); margin-bottom: 24px;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at 20% 10%, #000, transparent 70%);
    mask-image: radial-gradient(ellipse at 20% 10%, #000, transparent 70%);

  .hero .eyebrow { color: #7dd3fc; }
  .hero h2 { margin: 0; font-size: 30px; line-height: 1.3; letter-spacing: -.03em; }

  .hero-stats span { color: #94a3b8; font-size: 11px; }
  .hero-visual { position: relative; z-index: 1; flex: none; }
  .hero-card {
    width: 250px; background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 18px;
    padding: 18px; backdrop-filter: blur(14px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .2);

  .hero-card .tiny { color: #94a3b8; }
  .hero-card .num { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; margin: 4px 0 10px; }
  .hero-card .num span { font-size: 13px; color: #94a3b8; font-weight: 500; }
  .hero-bar { height: 7px; background: rgba(255, 255, 255, .12); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
  .hero-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #60a5fa, #a78bfa); }
  .hero-orb {

  /* library */
  .library-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; align-items: start; }

  .library-rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 138px; }

  .rail-item span { color: var(--faint); font-size: 10.5px; }
  .rail-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; margin-top: 5px; }

  .toolbar-card { background: #fff; border: 1px solid #e8edf5; border-radius: 18px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(15, 23, 42, .045); margin-bottom: 8px; }
  .toolbar-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 240px; display: flex; align-items: center; gap: 8px; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: #fff; }

  .conv-item { padding: 10px 11px; font-size: 12px; border-radius: 9px; }

  .chat-input { padding: 14px 18px; }

  .chat-input textarea { font-size: 13px; }

  .retrieval h4 { font-size: 13px; }

  /* settings */

  /* admin */

  .admin-topbar h1 { font-size: 19px; }
  .admin-content { padding: 30px 32px 56px; max-width: 1360px; }
  .admin-grid-2, .admin-grid-3 { gap: 20px; margin-bottom: 20px; }
  .admin-table-head { padding: 18px 20px; }
  .admin-table-head h3 { font-size: 14px; }
  .table { font-size: 12px; }
  .table th { padding: 11px 14px; font-size: 11px; }
  .table td { padding: 14px; }
  .filter-bar { gap: 9px; margin-bottom: 20px; }
  .source-cards { gap: 16px; }

  .source-card .num { font-size: 24px; }

  /* plugin page */

  .plugin-hero h2 { font-size: 26px; }
  .plugin-hero p { font-size: 13px; line-height: 1.75; }
  .plugin-grid { gap: 20px; }
  .plugin-card { padding: 22px; }
  .plugin-card h3 { font-size: 15px; }
  .plugin-card .desc { font-size: 12px; }

  .install-step .n { width: 28px; height: 28px; font-size: 11px; }

  .install-step span { font-size: 11px; }

  /* extension */
  .ext-wrap { padding: 28px; max-width: 1360px; }
  .ext-tabs { gap: 8px; margin-bottom: 18px; }
  .ext-tabs button { padding: 9px 15px; font-size: 12.5px; }
  .float-panel { width: 400px; height: 560px; bottom: 92px; }
  .fp-head { padding: 12px 14px; }
  .fp-body { padding: 14px; }
  .fp-msg .bubble { font-size: 11.5px; padding: 9px 11px; }
  .fp-input { padding: 10px 12px; }
  .fp-context { padding: 9px 12px; font-size: 11px; }

  /* donut */
  .donut-wrap { display: flex; align-items: center; gap: 20px; }
  .donut { width: 128px; height: 128px; border-radius: 50%; position: relative; flex: none; }
  .donut::after { content: ""; position: absolute; inset: 20px; background: #fff; border-radius: 50%; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
  .donut-center b { font-size: 20px; letter-spacing: -.02em; }
  .donut-center span { font-size: 10px; color: var(--muted); }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; font-size: 11.5px; }
  .donut-legend .item { display: flex; align-items: center; gap: 7px; }
  .donut-legend .swatch { width: 9px; height: 9px; border-radius: 3px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .web-content, .admin-content, .ext-wrap { animation: fadeUp .28s ease-out; }

  @media (max-width: 1100px) {
    .library-layout { grid-template-columns: 1fr; }
    .library-rail { position: static; flex-direction: row; flex-wrap: wrap; }
    .library-rail .rail-card { flex: 1; min-width: 240px; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero-visual { width: 100%; }
    .hero-card { width: 100%; max-width: 320px; }
  }
  /* ============================================================
     v0.5 — consumer-grade richness: gradients, illustrations, motion
     ============================================================ */
  :root {
    --grad-blue: linear-gradient(135deg, #3b82f6, #2f6fed);
    --grad-violet: linear-gradient(135deg, #7c3aed, #a78bfa);
    --grad-mint: linear-gradient(135deg, #10b981, #34d399);
  }

  /* colored tags */
  .tag.blue { background: #eef4ff; color: #2563eb; border-color: #dbe6ff; }
  .tag.purple { background: #f5f0ff; color: #7c3aed; border-color: #e9ddff; }
  .tag.amber { background: #fff8e6; color: #b45309; border-color: #fdecc8; }
  .tag.red { background: #fff0f0; color: #dc2626; border-color: #ffd9d9; }
  .tag.cyan { background: #eafcff; color: #0891b2; border-color: #cff5fb; }
  .tag.green { background: #eafaf3; color: #0f9d76; border-color: #c9efe1; }

  /* gradient surfaces */
  .stat-card { background: linear-gradient(135deg, #fff 0%, #f8fbff 100%); }
  .stat-card.purple { background: linear-gradient(135deg, #fff 0%, #fbf7ff 100%); }
  .stat-card.green { background: linear-gradient(135deg, #fff 0%, #f5fdf9 100%); }
  .stat-card.amber { background: linear-gradient(135deg, #fff 0%, #fffbf0 100%); }
  .admin-stat { background: linear-gradient(135deg, #fff 0%, #f8fbff 100%); }
  .admin-stat.purple { background: linear-gradient(135deg, #fff 0%, #fbf7ff 100%); }
  .admin-stat.green { background: linear-gradient(135deg, #fff 0%, #f5fdf9 100%); }
  .admin-stat.amber { background: linear-gradient(135deg, #fff 0%, #fffbf0 100%); }
  .rail-card { background: linear-gradient(180deg, #fff 0%, #fbfdff 100%); position: relative; overflow: hidden; }
  .rail-card::before {
    content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, #60a5fa, #a78bfa, transparent);
    opacity: .55;
  }
  .bubble { background: linear-gradient(135deg, #fbfcfe, #f5f8fc); }
  .chat-msg.user .bubble { background: linear-gradient(135deg, #eef4ff, #e4edff); border-color: #d7e3ff; }
  .fp-msg.user .bubble { background: linear-gradient(135deg, #eef4ff, #e4edff); border-color: #d7e3ff; }
  .chat-layout { background: linear-gradient(180deg, #fff, #fbfdff); }
  .admin-sidebar {
    background:
      radial-gradient(500px 300px at 0% 0%, rgba(59, 130, 246, .18), transparent 60%),
      linear-gradient(180deg, #0f172a, #111c33 60%, #0d1729);
  }

  /* motion */
  .stat-card, .admin-stat, .rail-card, .plugin-card, .settings-card, .budget-card {
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .stat-card:hover, .admin-stat:hover, .rail-card:hover, .plugin-card:hover, .settings-card:hover, .budget-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 38px rgba(15, 23, 42, .08);
  }
  .article-row { transition: background .15s, box-shadow .15s, transform .18s; }
  .article-row:hover { transform: translateX(3px); }
  .cite-card { transition: transform .18s, box-shadow .18s, border-color .18s; }
  .cite-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(47, 111, 237, .1); border-color: #c9d8ff; }
  .hero-card { animation: floatY 7s ease-in-out infinite; }
  .hero::after {
    content: ""; position: absolute; width: 320px; height: 320px;
    right: -80px; bottom: -160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(167, 139, 250, .35), transparent 65%);
    filter: blur(18px); pointer-events: none;
    animation: drift 12s ease-in-out infinite;
  }
  .float-ball { animation: pulseRing 3s ease-out infinite; }
  .login-preview .mini-ball { animation: floatY 5s ease-in-out infinite; }
  .login-preview::before {
    content: ""; position: absolute; top: 0; left: 22px; right: 22px; height: 1px;
    background: linear-gradient(90deg, transparent, #93c5fd, transparent);
    opacity: .8;
  }
  .modal-card { animation: popIn .2s ease-out; }
  .progress > i {
    background-image: linear-gradient(90deg, #2f6fed, #60a5fa, #2f6fed);
    background-size: 200% 100%;
    animation: shimmer 2.8s linear infinite;
  }
  .progress.success > i { background-image: linear-gradient(90deg, #0f9d76, #34d399, #0f9d76); }
  .progress.warning > i { background-image: linear-gradient(90deg, #d97706, #fbbf24, #d97706); }
  .progress.danger > i { background-image: linear-gradient(90deg, #dc2626, #f87171, #dc2626); }
  .hero-bar i {
    background-image: linear-gradient(90deg, #60a5fa, #a78bfa, #60a5fa);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(12px, -14px); } }
  @keyframes pulseRing {
    0% { box-shadow: 0 10px 24px rgba(47, 111, 237, .38), 0 0 0 0 rgba(47, 111, 237, .32); }
    70% { box-shadow: 0 10px 24px rgba(47, 111, 237, .38), 0 0 0 14px rgba(47, 111, 237, 0); }
    100% { box-shadow: 0 10px 24px rgba(47, 111, 237, .38), 0 0 0 0 rgba(47, 111, 237, 0); }
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  /* illustrations */
  .empty-illustrated { text-align: center; padding: 42px 24px 48px; }
  .empty-illustrated h3 { margin: 4px 0 4px; font-size: 19px; letter-spacing: -.02em; }
  .empty-illustrated p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .empty-art { width: 100%; max-width: 280px; margin: 0 auto 4px; }
  .empty-art svg, .welcome-art svg, .fp-art svg, .hero-graph svg { width: 100%; height: auto; display: block; }
  .chat-welcome { text-align: center; padding: 16px 24px 28px; max-width: 760px; margin: 0 auto; }
  .welcome-art { width: 100%; max-width: 320px; margin: 0 auto 2px; }
  .chat-welcome h3 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.025em; }
  .chat-welcome p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .suggest-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; }
  .suggest-card {
    background: linear-gradient(180deg, #fff, #fbfdff);
    border: 1px solid var(--line); border-radius: 15px; padding: 14px;
    text-align: left; transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .suggest-card:hover { transform: translateY(-3px); border-color: #c9d8ff; box-shadow: 0 14px 30px rgba(47, 111, 237, .12); }
  .suggest-icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--primary-soft); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-bottom: 9px;
  }
  .suggest-card:nth-child(2) .suggest-icon { background: var(--purple-soft); color: var(--purple); }
  .suggest-card:nth-child(3) .suggest-icon { background: var(--warning-soft); color: var(--warning); }
  .suggest-card b { display: block; font-size: 12.5px; margin-bottom: 3px; }
  .suggest-card span { color: var(--muted); font-size: 11px; line-height: 1.55; }
  .hero-graph { position: absolute; right: -52px; top: -26px; width: 270px; opacity: .38; pointer-events: none; z-index: 0; }
  .hero-card { position: relative; z-index: 1; }
  .fp-art { width: 100%; max-width: 230px; margin: 0 auto 2px; }

  @media (max-width: 900px) {
    .suggest-grid { grid-template-columns: 1fr; }
    .hero-graph { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
  /* ============================================================
     v0.6 — restrained Linear / Notion style
     ============================================================ */
  :root {
    --primary: #5b5bd6;
    --primary-600: #4a4ac4;
    --primary-soft: #efeffa;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6f6f6a;
    --faint: #9a9a94;
    --line: #e6e4df;
    --soft: #fbfbf9;
    --success: #3f7a5a;
    --success-soft: #eef7f1;
    --warning: #8a5a1f;
    --warning-soft: #fbf3e6;
    --danger: #a33b3b;
    --danger-soft: #fbeeee;
    --purple: #5b5bd6;
    --purple-soft: #efeffa;
    --shadow: none;
    --shadow-lg: 0 16px 40px rgba(28, 28, 26, .12);
  }
  body { background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.65; }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }

  /* demo chrome */
  .demo-bar { background: #fff; color: var(--muted); border-bottom: 1px solid var(--line); }
  .demo-brand { color: var(--ink); }
  .demo-brand span { color: var(--faint); }
  .demo-tabs button { color: var(--muted); }
  .demo-tabs button:hover { background: #f1f0ec; color: var(--ink); }
  .demo-tabs button.active { background: var(--ink); color: #fff; }
  .demo-note { color: var(--faint); }
  .demo-note button { border-color: var(--line); color: var(--muted); }
  .demo-note button:hover { background: #f1f0ec; }

  /* controls */
  .btn { background: var(--ink); color: #fff; box-shadow: none; border-radius: 8px; font-weight: 600; }
  .btn:hover { background: #333330; transform: none; box-shadow: none; }
  .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--soft); }
  .btn-soft { background: #f1f0ec; color: var(--ink); }
  .btn-soft:hover { background: #e9e8e3; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: #8f3232; }

  /* surfaces */
  .card, .article-list, .chat-layout, .settings-card, .admin-table-card, .budget-card, .stat-card, .admin-stat, .model-card, .plugin-card, .rail-card {
    box-shadow: none;
    border-color: var(--line);
    border-radius: 12px;
    background: #fff;
  }
  .card-head h3, .admin-table-head h3 { font-size: 14px; }
  .card-head p, .admin-table-head .muted { font-size: 11.5px; }
  .card, .rail-card, .plugin-card, .settings-card, .budget-card, .stat-card, .admin-stat { transition: border-color .15s, background .15s; }
  .card:hover, .rail-card:hover, .plugin-card:hover, .settings-card:hover, .budget-card:hover, .stat-card:hover, .admin-stat:hover {
    transform: none; box-shadow: none; border-color: #d6d3cc;
  }

  /* sidebars + topbar */
  .sidebar, .admin-sidebar { background: #fbfbf9; border-right: 1px solid var(--line); box-shadow: none; }
  .admin-sidebar { background: #fbfbf9; }
  .side-brand .logo { background: var(--ink); color: #fff; box-shadow: none; border-radius: 8px; }
  .side-brand b, .admin-sidebar .side-brand b { color: var(--ink); }
  .side-brand small, .admin-sidebar .side-brand small { color: var(--faint); }
  .nav-item { color: var(--muted); border-radius: 7px; }
  .nav-item:hover { background: #f1f0ec; color: var(--ink); }
  .nav-item.active { background: #ecebe6; color: var(--ink); font-weight: 600; }
  .nav-item .ico, .admin-sidebar .nav-item .ico {
    background: transparent; color: var(--faint);
    width: 22px; height: 22px; box-shadow: none; font-size: 13px;
  }
  .nav-item:hover .ico { background: transparent; color: var(--ink); }
  .nav-item.active .ico, .admin-sidebar .nav-item.active .ico { background: transparent; color: var(--ink); box-shadow: none; }
  .admin-sidebar .nav-item { color: var(--muted); }
  .admin-sidebar .nav-item:hover { background: #f1f0ec; color: var(--ink); }
  .admin-sidebar .nav-item.active { background: #ecebe6; color: var(--ink); }
  .admin-sidebar .side-box { background: #fff; border-color: var(--line); color: var(--muted); }
  .admin-sidebar .side-box b { color: var(--ink); }
  .admin-sidebar .side-user { border-top-color: var(--line); }
  .admin-sidebar .side-user .name { color: var(--ink); }
  .admin-sidebar .side-user .role { color: var(--faint); }
  .side-box { background: #fff; border-color: var(--line); color: var(--muted); }
  .side-box b { color: var(--ink); }
  .side-user { border-top-color: var(--line); }
  .topbar, .admin-topbar { background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar h1, .admin-topbar h1 { font-size: 18px; }
  .quota-chip { background: #fbfbf9; border-color: var(--line); color: var(--muted); }
  .quota-chip b { color: var(--ink); }

  /* type + flat hero */
  .page-head h2 { font-size: 24px; letter-spacing: -.025em; }
  .page-head p { color: var(--muted); }
  .hero {
    background: transparent; box-shadow: none; border-radius: 0;
    padding: 6px 0 24px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line); color: var(--ink); display: block;
  }
  .hero::before, .hero::after, .hero-orb, .hero-visual, .hero-graph { display: none; }
  .hero .eyebrow { color: var(--faint); letter-spacing: 1.6px; font-size: 10px; }
  .hero h2 { color: var(--ink); font-size: 30px; font-weight: 650; letter-spacing: -.03em; }
  .hero p { color: var(--muted); font-size: 13px; }
  .hero-actions { margin-top: 16px; }
  .hero .btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .hero .btn-ghost:hover { background: var(--soft); }
  .hero-stats { gap: 32px; margin-top: 22px; }
  .hero-stats b { color: var(--ink); font-size: 22px; }
  .hero-stats span { color: var(--faint); }
  .eyebrow { color: var(--faint); }

  /* stat cards: typographic */
  .stat-card, .admin-stat {
    background: #fff !important; border: 1px solid var(--line) !important;
    border-radius: 10px !important; box-shadow: none !important;
    min-height: 92px; padding: 16px 18px;
  }
  .stat-card::after, .admin-stat::after { display: none; }
  .stat-card b, .admin-stat b { font-size: 28px; font-weight: 650; letter-spacing: -.03em; }
  .stat-card span, .admin-stat span { color: var(--muted); }
  .stat-card .stat-icon, .admin-stat .stat-icon {
    background: transparent; color: var(--faint);
    width: 24px; height: 24px; font-size: 13px;
    top: 14px; right: 14px; opacity: .6;
  }
  .stat-card.purple .stat-icon, .stat-card.green .stat-icon, .stat-card.amber .stat-icon,
  .admin-stat.purple .stat-icon, .admin-stat.green .stat-icon, .admin-stat.amber .stat-icon {
    background: transparent; color: var(--faint);
  }

  /* tags + badges */
  .tag, .tag.blue, .tag.purple, .tag.amber, .tag.red, .tag.cyan, .tag.green {
    background: #f4f3ef; color: var(--muted); border: 1px solid #e9e7e1; font-weight: 500;

  if (a.status === 'FAILED') return '<span class="badge fail"><i class="dot"></i>解析失败</span>';
  if (a.status === 'EMBEDDING') return '<span class="badge run"><i class="dot"></i>向量化中</span>';
  return '<span class="badge neutral">' + esc(a.status) + '</span>';
}

function renderContent(text) {
  return esc(text).replace(/\n/g, '<br>').replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
}

function renderCitations(citations) {
  if (!citations || !citations.length) return '';
  return `<div class="cite-cards">${citations.map((c, i) => `
    <div class="cite-card" data-action="open-citation" data-article="${esc(c.articleId || '')}" data-chunk="${esc(c.chunk || '')}">
      <b>[${i + 1}] ${esc(c.title)}</b>
      <span>${c.score ? '相似度 ' + c.score : '当前页面'}</span>
    </div>`).join('')}</div>`;
}

function tagClass(t) {
  const map = {

    '检索': 'cyan', '切片': 'cyan', '中文': 'green', '评测': 'green', '向量': 'purple'

}

  let html = '';
  if (state.scene === 'login') html = renderLogin();

  if (state.scene === 'web' && state.webScreen === 'library') {
    applyLibraryFilter();
  }
}

function applyLibraryFilter() {
  const q = (state.search || '').trim().toLowerCase();
  const rows = [...document.querySelectorAll('.article-row')];
  rows.forEach(row => {
    const text = (row.dataset.search || '').toLowerCase();
    row.classList.toggle('hidden', !!q && !text.includes(q));
  });
  const visible = rows.filter(row => !row.classList.contains('hidden')).length;
  const empty = document.querySelector('#libraryEmpty');
  const list = document.querySelector('.library-main .article-list');
  if (empty) empty.classList.toggle('hidden', visible > 0);
  if (list) list.classList.toggle('hidden', visible === 0);
}

function importStatus(status) {

}

function renderBarChart(values, labels) {
  const max = Math.max(...values, 1);
  return `<div class="bar-chart">${values.map((v, i) => `
    <div class="bar-col">
      <div class="bar ${i === values.length - 2 ? 'active' : ''}" style="height:${Math.max(4, Math.round(v / max * 100))}%"></div>
      <span>${labels[i]}</span>
    </div>`).join('')}</div>`;
}

function handleLogin() {
  const email = ($('#loginEmail') || {}).value || '';
  if (!email.includes('@')) {
    showToast('请输入有效邮箱', 'error');
    return;
  }
  if (state.loginMode === 'register') {
    showToast('注册成功，已分配 20 万 tokens/月试用额度', 'success');
  } else {
    showToast('登录成功', 'success');
  }
  state.scene = 'web';
  state.webScreen = 'library';
  render();
}

function createConversation() {
  const id = 'c' + Date.now();
  state.conversations.unshift({ id, title: '新对话', time: '刚刚', messages: [] });
  state.activeConversation = id;
  state.chatScope = 'all';
  state.webScreen = 'chat';
  render();
}

function sendChat() {
  if (state.streaming) {
    showToast('正在生成，请稍候', 'error');
    return;
  }
  const input = $('#chatInput');
  const q = input ? input.value.trim() : '';
  if (!q) {
    showToast('请输入问题', 'error');
    return;
  }
  const conv = getConversation();
  if (!conv) return;
  conv.messages.push({ role: 'user', content: q });
  conv.messages.push({ role: 'assistant', content: '', streaming: true, citations: [] });
  state.streaming = true;
  render();

  const answer = buildAnswer(q, state.chatScope);
  setTimeout(() => {
    const target = $('#chatStreamTarget');
    if (!target) {
      finishChat(conv, answer);
      return;
    }
    streamInto(target, answer.text, () => finishChat(conv, answer));
  }, 450);
}

function finishChat(conv, answer) {
  const last = conv.messages[conv.messages.length - 1];
  last.content = answer.text;
  last.streaming = false;
  last.citations = answer.citations || [];
  state.streaming = false;
  render();
}

function buildAnswer(q, scope) {
  if (scope === 'article') {
    const a = getSelectedArticle();
    return {
      text: `《${a.title}》的核心观点是：${a.summary} 它建议先按标题层级切分，再在段内按句子边界二次切分，单块 500~800 字，重叠 10%~15%。`,
      citations: [{ articleId: a.id, chunk: 3, title: a.title, quote: '一种更稳的做法是先按标题层级切一级…', score: null }]
    };
  }
  if (/redis|向量/i.test(q)) {
    return {
      text: '你收藏的资料里，Redis Stack 主要是用 RediSearch 做向量索引和 metadata 过滤；Spring AI 通过 RedisVectorStore 对接。注意 Redis Stack 不是普通 Redis，Docker 镜像要换。[1]',
      citations: [{ articleId: 'a4', chunk: 2, title: 'Redis Stack 向量检索入门', quote: 'RediSearch 的向量索引、metadata 过滤…', score: 0.9 }]
    };
  }
  if (/引用|幻觉|准确/i.test(q)) {
    return {
      text: '引用不准确通常有三个原因：切片不完整、检索 topK 太小、提示词没有强制引用。先检查切片，再调 topK，最后才考虑 rerank。[1][2]',
      citations: [
        { articleId: 'a6', chunk: 2, title: 'RAG 评测的 5 个指标', quote: '引用准确率衡量引用是否支持答案…', score: 0.86 },
        { articleId: 'a1', chunk: 3, title: 'RAG 切片策略…', quote: '切片不完整会导致引用找不到原文…', score: 0.82 }
      ]
    };
  }
  if (/chunk|切片|大小/i.test(q)) {
    return {
      text: '你收藏的资料里主要有三种倾向：\n\n1. 按语义段落切，单块 500~800 字，重叠 10%~15%。这是最常见的中文长文方案。[1]\n2. 先按标题层级切，再在段内二次切分。适合结构清晰的长文。[2]\n3. chunk 大小没有统一答案，要和 embedding 模型、topK 一起调。[3]',
      citations: [
        { articleId: 'a1', chunk: 3, title: 'RAG 切片策略：按段落还是按固定长度？', quote: '一种更稳的做法是先按标题层级切一级…', score: 0.87 },
        { articleId: 'a2', chunk: 5, title: 'Spring AI 1.0 实战：ChatClient 与 VectorStore', quote: 'chunk 大小要和 embedding 模型、topK 一起调…', score: 0.83 },
        { articleId: 'a6', chunk: 2, title: 'RAG 评测的 5 个指标', quote: 'FAQ、代码、论文的合理切法并不相同…', score: 0.79 }
      ]
    };
  }
  return {
    text: '你的资料库里没有找到直接相关的内容。可以换一种问法，或把相关文章收藏进来。我不会用通用知识强行补全，避免给出没有出处的答案。',
    citations: []
  };
}

function streamInto(el, text, done) {
  let i = 0;
  const timer = setInterval(() => {
    i += 2 + Math.floor(Math.random() * 3);
    el.textContent = text.slice(0, i);
    const body = el.closest('.chat-body') || el.closest('.fp-body');
    if (body) body.scrollTop = body.scrollHeight;
    if (i >= text.length) {
      clearInterval(timer);
      done();
    }
  }, 24);
}

function openCitation(el) {
  const id = el.dataset.article;
  const chunk = el.dataset.chunk;
  if (!id) {
    showToast('这是当前页面引用，收藏后可跳转', 'error');
    return;
  }
  const a = getArticle(id);
  if (!a) {
    showToast('资料不存在（演示数据）', 'error');
    return;
  }
  state.selectedArticleId = id;
  state.webScreen = 'detail';
  state.scene = 'web';
  state.detailTab = 'body';
  state.highlightChunk = chunk || null;
  render();
  if (chunk) setTimeout(() => focusChunk(chunk), 50);
}

function focusChunk(chunk) {
  document.querySelectorAll('.chunk-box').forEach(x => x.classList.remove('highlight'));
  const box = document.getElementById('chunk-' + chunk);
  if (box) {
    box.classList.add('highlight');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function reindexArticle(id) {
  const a = getArticle(id);
  if (!a) return;
  a.status = 'PARSING';
  a.progress = 0;
  render();
  showToast('已加入重新解析队列', 'success');
  let p = 0;
  const timer = setInterval(() => {
    p += 25;
    a.progress = Math.min(p, 100);
    if (p >= 100) {
      clearInterval(timer);
      a.status = 'READY';
      a.chunks = a.chunks || 18;
      a.summary = '重新解析完成：已重建切片和向量。';
    }
    if (state.scene === 'web' && (state.webScreen === 'detail' || state.webScreen === 'library')) render();
  }, 500);
}

function confirmDelete(id) {
  const a = getArticle(id);
  if (!a) return;
  state.pendingDelete = id;
  openModal(`
    <div class="modal-head"><h3>删除资料</h3><button data-action="close-modal">×</button></div>
    <div class="modal-body">
      <p style="margin:0 0 8px">确定删除《${esc(a.title)}》吗？</p>
      <div class="small muted">删除后切片和向量会异步清理，问答将不再引用这篇资料。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal">取消</button>
      <button class="btn btn-danger" data-action="confirm-delete">删除</button>
    </div>`);
}

function doDelete() {
  const id = state.pendingDelete;
  state.articles = state.articles.filter(a => a.id !== id);
  state.pendingDelete = null;
  closeModal();
  state.webScreen = 'library';
  showToast('已删除（演示）', 'success');
  render();
}

function addArticleFromInput() {
  const input = $('#newArticleUrl');
  const url = input ? input.value.trim() : '';
  if (!url) {
    showToast('请先粘贴文章链接', 'error');
    return;
  }
  let domain = 'example.com';
  try { domain = new URL(url).hostname || domain; } catch (e) {}
  const a = {
    id: 'a' + Date.now(),
    title: '新收藏：' + (url.length > 42 ? url.slice(0, 42) + '…' : url),
    domain,
    url,
    summary: '正在抓取正文并解析…',
    tags: ['待解析'],
    status: 'PARSING',
    chunks: 0,
    words: 0,
    date: '今天',
    source: '手动收藏',
    progress: 0
  };
  state.articles.unshift(a);
  render();
  showToast('已加入解析队列', 'success');
  let p = 0;
  const timer = setInterval(() => {
    p += 20;
    a.progress = Math.min(p, 100);
    if (p >= 100) {
      clearInterval(timer);
      a.status = 'READY';
      a.summary = '解析完成：这是一篇演示文章，已生成 12 个切片。';
      a.tags = ['演示'];
      a.chunks = 12;
      a.words = 860;
    }
    if (state.scene === 'web' && (state.webScreen === 'library' || state.webScreen === 'detail')) render();
  }, 550);
}

/* ---------- 用量 / 管理 ---------- */
function openQuotaModal(userId) {
  const u = state.users.find(x => x.id === userId);
  if (!u) return;
  openModal(`
    <div class="modal-head"><h3>调整配额</h3><button data-action="close-modal">×</button></div>
    <div class="modal-body">
      <div class="small muted" style="margin-bottom:10px">用户：${esc(u.email)}</div>
      <div class="field"><label>月度 tokens 配额</label><input class="input" id="quotaInput" type="number" value="${u.quota}"></div>
      <div class="small muted">修改后立即生效；超过配额后该用户的 AI 调用会被拒绝。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal">取消</button>
      <button class="btn" data-action="save-quota" data-user="${u.id}">保存</button>
    </div>`);
}

function saveQuota() {
  const input = $('#quotaInput');
  const val = input ? parseInt(input.value, 10) : NaN;
  if (!val || val < 1000) {
    showToast('配额至少 1000 tokens', 'error');
    return;
  }
  const id = document.querySelector('[data-action="save-quota"]').dataset.user;
  const u = state.users.find(x => x.id === id);
  if (u) u.quota = val;
  closeModal();
  showToast('配额已更新（模拟）', 'success');
  render();
}

function toggleUser(id) {
  const u = state.users.find(x => x.id === id);
  if (!u) return;
  if (u.role === 'ADMIN') {
    showToast('不能禁用唯一管理员', 'error');
    return;
  }
  u.status = u.status === 'ACTIVE' ? 'DISABLED' : 'ACTIVE';
  showToast(u.status === 'ACTIVE' ? '用户已启用' : '用户已禁用', 'success');
  render();
}

function openBudgetModal() {
  const b = state.modelConfig.budget;
  openModal(`
    <div class="modal-head"><h3>调整预算与配额</h3><button data-action="close-modal">×</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>全局月度 tokens（万）</label><input class="input" id="modalBudgetTokens" type="number" value="${b.globalTokens / 10000}"></div>
        <div class="field"><label>全局月度成本（元）</label><input class="input" id="modalBudgetCost" type="number" value="${b.globalCost}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>新用户默认 tokens（万）</label><input class="input" id="modalBudgetDefault" type="number" value="${b.defaultUserTokens / 10000}"></div>
        <div class="field"><label>告警阈值 %</label><input class="input" id="modalBudgetAlert" type="number" value="${b.alert}"></div>
      </div>
      <div class="small muted">测试期建议小额：全局 ¥20/月，新用户 20 万 tokens/月。超限后 AI 调用会被拒绝。</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal">取消</button>
      <button class="btn" data-action="save-budget-modal">保存</button>
    </div>`);
}

function saveBudgetModal() {
  const t = parseInt(($('#modalBudgetTokens') || {}).value, 10);
  const c = parseFloat(($('#modalBudgetCost') || {}).value);
  const d = parseInt(($('#modalBudgetDefault') || {}).value, 10);
  const a = parseInt(($('#modalBudgetAlert') || {}).value, 10);
  if (!t || !c || !d) {
    showToast('请填写完整预算', 'error');
    return;
  }
  state.modelConfig.budget.globalTokens = t * 10000;
  state.modelConfig.budget.globalCost = c;
  state.modelConfig.budget.defaultUserTokens = d * 10000;
  state.modelConfig.budget.alert = a || 80;
  closeModal();
  showToast('预算已更新（模拟）', 'success');
  render();
}

function saveBudgetFromInputs() {
  const t = parseInt(($('#budgetTokens') || {}).value, 10);
  const c = parseFloat(($('#budgetCost') || {}).value);
  const d = parseInt(($('#budgetDefault') || {}).value, 10);
  const a = parseInt(($('#budgetAlert') || {}).value, 10);
  const r = parseInt(($('#budgetRate') || {}).value, 10);
  if (t) state.modelConfig.budget.globalTokens = t * 10000;
  if (c) state.modelConfig.budget.globalCost = c;
  if (d) state.modelConfig.budget.defaultUserTokens = d * 10000;
  if (a) state.modelConfig.budget.alert = a;
  if (r) state.modelConfig.budget.rate = r;
  showToast('预算已保存（模拟）', 'success');
  render();
}

function saveModel() {
  const c = state.modelConfig;
  const get = (id) => ($('#' + id) || {}).value;
  if (get('chatProvider')) c.chat.provider = get('chatProvider');
  if (get('chatBaseUrl')) c.chat.baseUrl = get('chatBaseUrl');
  if (get('chatModel')) c.chat.model = get('chatModel');
  if (get('chatKey')) c.chat.key = get('chatKey');
  if (get('chatInputPrice')) c.chat.inputPrice = parseFloat(get('chatInputPrice')) || c.chat.inputPrice;
  if (get('chatOutputPrice')) c.chat.outputPrice = parseFloat(get('chatOutputPrice')) || c.chat.outputPrice;
  if (get('embedProvider')) c.embedding.provider = get('embedProvider');
  if (get('embedModel')) c.embedding.model = get('embedModel');
  if (get('embedDims')) c.embedding.dims = parseInt(get('embedDims'), 10) || c.embedding.dims;
  if (get('embedKey')) c.embedding.key = get('embedKey');
  if (get('embedPrice')) c.embedding.inputPrice = parseFloat(get('embedPrice')) || c.embedding.inputPrice;
  showToast('模型配置已保存（模拟）', 'success');
  render();
}

function retryImport(id) {
  const imp = state.imports.find(i => i.id === id);
  if (!imp) return;
  imp.status = 'RUNNING';
  imp.failed = 0;
  showToast('已重试失败项（模拟）', 'success');
  render();
  setTimeout(() => {
    imp.status = 'DONE';
    imp.success = imp.total - imp.skipped;
    imp.duration = '4m 02s';
    if (state.scene === 'admin' && state.adminScreen === 'imports') render();
  }, 1800);
}

function retryTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.status = 'RUNNING';
  t.retry += 1;
  showToast('已重新入队（模拟）', 'success');
  render();
  setTimeout(() => {
    t.status = 'READY';
    t.stage = 'DONE';
    if (state.scene === 'admin' && state.adminScreen === 'tasks') render();
  }, 1800);
}

/* ---------- 插件 ---------- */
function savePage() {
  const page = state.currentPage;
  if (page.saved) {
    showToast('这篇已经在资料库中了', 'error');
    return;
  }
  page.saved = true;
  const a = {
    id: 'a-cur',
    title: page.title,
    domain: page.domain,
    url: page.url,
    summary: '正在解析当前页面…',
    tags: page.tags,
    status: 'PARSING',
    chunks: 0,
    words: 0,
    date: '今天',
    source: '手动收藏',
    progress: 10
  };
  state.articles.unshift(a);
  render();
  showToast('已收藏，正在解析…', 'success');
  setTimeout(() => {
    a.status = 'READY';
    a.summary = page.summary;
    a.chunks = 12;
    a.words = 980;
    if (state.scene === 'extension') render();
  }, 1600);
}

function sendPanel() {
  if (state.panelStreaming) {
    showToast('正在生成，请稍候', 'error');
    return;
  }
  const input = $('#panelInput');
  const q = input ? input.value.trim() : '';
  if (!q) return;
  state.panelMessages.push({ role: 'user', content: q });
  state.panelMessages.push({ role: 'assistant', content: '', streaming: true, citations: [] });
  state.panelStreaming = true;
  render();

  const answer = buildPanelAnswer(q, state.panelTab);
  setTimeout(() => {
    const target = $('#panelStreamTarget');
    if (!target) {
      finishPanel(answer);
      return;
    }
    streamInto(target, answer.text, () => finishPanel(answer));
  }, 400);
}

function finishPanel(answer) {
  const last = state.panelMessages[state.panelMessages.length - 1];
  last.content = answer.text;
  last.streaming = false;
  last.citations = answer.citations || [];
  state.panelStreaming = false;
  render();
}

function buildPanelAnswer(q, tab) {
  if (tab === 'current') {
    return {
      text: '这篇主要讲了 RAG 评测的五个指标：召回率、引用准确率、答案正确率、平均延迟和单次成本。它建议先准备 30 个真实问题跑基线，再调 chunk size、topK 和 rerank。[1]',
      citations: [{ articleId: '', chunk: '', title: '当前页面：RAG 评测的 5 个指标', quote: '五个指标：召回率、引用准确率、答案正确率、延迟、成本', score: null }]
    };
  }
  if (tab === 'general') {
    return {
      text: '这是通用模式（P2）：不检索资料库，直接调用模型。正式版会在这里明确标注，避免和资料库回答混淆。当前演示只展示交互，不产生真实调用。',
      citations: []
    };
  }
  if (/chunk|切片|大小/i.test(q)) {
    const prefix = state.panelScope === 'folder' ? '在“技术文章”文件夹里，' : state.panelScope === 'rag' ? '在 RAG 标签下，' : '';
    return {
      text: `${prefix}chunk 一般建议 500~800 字，重叠 10%~15%；也有文章认为要和 embedding 模型、topK 一起调。[1][2]`,
      citations: [
        { articleId: 'a1', chunk: 3, title: 'RAG 切片策略…', quote: '单块 500~800 字，重叠 10%~15%', score: 0.87 },
        { articleId: 'a2', chunk: 5, title: 'Spring AI 1.0 实战', quote: 'chunk 大小要和模型、topK 一起调', score: 0.81 }
      ]
    };
  }
  if (state.panelScope === 'folder') {
    return {
      text: '“技术文章”文件夹里共 42 篇资料，涵盖 RAG、Spring AI、Redis 和前端。你可以直接问某个主题，我会只在这个文件夹里检索并给出引用。[1][2]',
      citations: [
        { articleId: 'a1', chunk: 3, title: 'RAG 切片策略…', quote: '技术文章 / RAG', score: 0.85 },
        { articleId: 'a4', chunk: 2, title: 'Redis Stack 向量检索入门', quote: '技术文章 / Java', score: 0.8 }
      ]
    };
  }
  if (state.panelScope === 'rag') {
    return {
      text: 'RAG 标签下共 18 篇资料，主要围绕切片、检索、引用和评测。你可以问“chunk 怎么切”“引用不准怎么办”“怎么评测”。[1][2]',
      citations: [
        { articleId: 'a1', chunk: 3, title: 'RAG 切片策略…', quote: 'RAG / 切片', score: 0.88 },
        { articleId: 'a6', chunk: 2, title: 'RAG 评测的 5 个指标', quote: 'RAG / 评测', score: 0.82 }
      ]
    };
  }
  return {
    text: '你的资料库里没有找到直接相关的内容。可以切换到“当前页面”问这篇，或把相关文章收藏进来。',
    citations: []
  };
}

let importTimer = null;
function startImport() {
  if (state.bookmarkImport.running) return;
  const b = state.bookmarkImport;
  b.running = true;
  b.progress = 0;
  b.items.forEach(it => it.status = 'PENDING');
  showToast('开始导入，先抓正文再切片（模拟）', 'success');
  render();

  importTimer = setInterval(() => {
    b.progress = Math.min(100, b.progress + 4);
    b.items.forEach((it, idx) => {
      const start = idx * 18;
      if (b.progress >= start + 18) it.status = it.finalStatus;
      else if (b.progress >= start) it.status = 'FETCHING';
      else it.status = 'PENDING';
    });
    if (b.progress >= 100) {
      clearInterval(importTimer);
      b.running = false;
      b.progress = 100;
      b.items.forEach(it => it.status = it.finalStatus);
      showToast('导入完成：成功 38，失败 2，跳过 2（模拟）', 'success');
    }
    if (state.scene === 'extension' && state.extScreen === 'import') render();
  }, 220);
}

function resetImport() {
  if (importTimer) clearInterval(importTimer);
  state.bookmarkImport.running = false;
  state.bookmarkImport.progress = 0;
  state.bookmarkImport.items.forEach((it, idx) => {
    it.status = idx < 4 ? 'READY' : 'FAILED';
  });
  showToast('已重新扫描书签（模拟）', 'success');
  render();
}

/* ============================================================
   启动
   ============================================================ */
render();
</script>
