<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾页</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="popup">
      <div class="brand">拾页 <span id="version">ShiYe</span></div>
      <p class="muted">把收藏夹变成可对话的知识库。</p>

      <div id="userLine" class="user-line">未连接账号</div>

      <label class="row">
        <span>在网页显示悬浮球</span>
        <input id="ballEnabled" type="checkbox" />
      </label>

      <div class="actions">
        <button id="openWeb" class="primary">打开拾页</button>
        <button id="openOptions">插件设置</button>
      </div>

      <button id="checkBackend" class="link-button">检查后端连接</button>

      <p class="hint">支持书签导入、资料库问答、当前页问答和收藏当前页。</p>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
