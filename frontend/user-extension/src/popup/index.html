<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾页</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="popup">
      <div class="brand">拾页 <span>ShiYe</span></div>
      <p class="muted">把收藏夹变成可对话的知识库。</p>

      <label class="row">
        <span>在网页显示悬浮球</span>
        <input id="ballEnabled" type="checkbox" />
      </label>

      <div class="actions">
        <button id="openOptions" class="primary">打开设置</button>
        <button id="checkBackend">检查后端</button>
      </div>

      <p class="hint">书签导入已可用：在设置页连接账号并选择文件夹。问答接口待接入。</p>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
